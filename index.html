<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MJ SUB4UNLOCK - Premium Link Locker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- GENERATE PAGE -->
    <div class="container" id="genPage">
        <div class="brand">
            <div class="logo-wrap">
                <div class="logo-ring"></div>
                <div class="logo-main">
                    <img src="https://i.ibb.co/4nR3r8fm/bb396f27-1712-4ef9-9982-6d3a56df50bd.jpg" alt="MJ Logo">
                </div>
            </div>
            <div class="brand-name" id="brandName1"></div>
            <div class="brand-tag" id="brandTag1"></div>
        </div>

        <div class="card">
            <div class="sec-label"><i class="fas fa-link"></i> Target Link</div>
            <div class="inp-group">
                <label>Original Link <span style="color:var(--red);">*</span></label>
                <textarea id="origLink" placeholder="Paste the link you want to lock..." rows="2"></textarea>
            </div>
            <div class="inp-group">
                <label>Password <span class="opt-tag">OPTIONAL</span></label>
                <input type="password" id="setPass" placeholder="Leave empty for no password">
            </div>

            <div class="social-section">
                <div class="sec-label"><i class="fas fa-share-nodes"></i> Social Verification</div>
                <button class="btn-add-soc" onclick="openSocialModal()">
                    <i class="fas fa-plus-circle"></i> Select Social Platforms
                    <span class="soc-badge" id="socBadge" style="display:none;">0</span>
                </button>
                <div class="external-soc-inputs" id="externalSocInputs"></div>
            </div>

            <button class="btn btn-gen" onclick="generateLink()">
                <i class="fas fa-bolt"></i> Generate Locked Link
            </button>

            <div class="result-box" id="resultBox">
                <div class="result-lbl"><i class="fas fa-check-circle"></i> Link Ready</div>
                <div class="result-link" id="resultLink"></div>
                <button class="btn btn-copy" onclick="copyResult()">
                    <i class="fas fa-copy"></i> Copy Link
                </button>
            </div>
        </div>

        <!-- HISTORY SECTION -->
        <div class="history-section">
            <div class="history-header">
                <h3><i class="fas fa-clock-rotate-left"></i> History</h3>
                <button class="btn-clear-hist" onclick="clearHistory()">
                    <i class="fas fa-trash-can"></i> Clear All
                </button>
            </div>
            <div id="historyList" class="history-list">
                <div class="empty-history">
                    <i class="fas fa-inbox"></i> No links generated yet
                </div>
            </div>
        </div>
    </div>

    <!-- SUBSCRIBE PAGE -->
    <div class="container" id="subPage" style="display:none;">
        <div class="brand">
            <div class="logo-wrap">
                <div class="logo-ring"></div>
                <div class="logo-main">
                    <img src="https://i.ibb.co/4nR3r8fm/bb396f27-1712-4ef9-9982-6d3a56df50bd.jpg" alt="MJ Logo">
                </div>
            </div>
            <div class="brand-name" id="brandName2" style="font-size:22px;"></div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="unlock-icon-big"><i class="fas fa-lock-open"></i></div>
            <div class="unlock-ttl" id="unlockTitle">Complete Steps to Unlock</div>
            <p style="font-size:11px;color:var(--sub);margin-bottom:14px;">Follow all steps below to access the link</p>
            <div id="stepsContainer"></div>
            <button class="btn btn-cont" id="continueBtn" onclick="handleContinue()">
                <i class="fas fa-arrow-right"></i> Continue
            </button>
        </div>
    </div>

    <!-- PASSWORD PAGE -->
    <div class="container" id="passPage" style="display:none;">
        <div class="brand">
            <div class="logo-wrap">
                <div class="logo-ring"></div>
                <div class="logo-main">
                    <img src="https://i.ibb.co/4nR3r8fm/bb396f27-1712-4ef9-9982-6d3a56df50bd.jpg" alt="MJ Logo">
                </div>
            </div>
            <div class="brand-name" id="brandName3" style="font-size:22px;"></div>
        </div>
        <div class="card" style="text-align:center;">
            <div class="pass-icon-big"><i class="fas fa-circle-lock"></i></div>
            <h2 style="font-weight:800;margin:6px 0;font-size:20px;" id="passTitle">Enter Password</h2>
            <p style="font-size:11px;color:var(--sub);margin-bottom:14px;">Password daalein link unlock karne ke liye</p>
            <div class="pass-input-wrap">
                <input type="password" id="unlockPass" placeholder="Enter password...">
                <button onclick="toggleEye()" class="eye-btn"><i class="fas fa-eye"></i></button>
            </div>
            <button class="btn btn-unlock" onclick="finalUnlock()">
                <i class="fas fa-unlock"></i> Unlock Now
            </button>
            <div class="err-msg" id="errorMsg">
                <i class="fas fa-triangle-exclamation"></i> Wrong password!
            </div>
        </div>
    </div>

    <!-- SOCIAL MEDIA MODAL -->
    <div class="modal-overlay" id="socialModal">
        <div class="modal">
            <div class="modal-head">
                <h3><i class="fas fa-share-nodes"></i> Select Platforms</h3>
                <button class="modal-close" onclick="closeSocialModal()"><i class="fas fa-xmark"></i></button>
            </div>
            <div id="modalCheckboxes"></div>
            <button class="btn-modal-save" onclick="saveSocialSelection()">
                <i class="fas fa-check"></i> Done - Add Links Outside
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
                                                      </html>
